# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main","feature-devops"]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    # 🚀 ENHANCEMENT 2: Cache pip dependencies for faster builds
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-asyncio httpx black coverage
        if [ -f valutionapi/requirements.txt ]; then pip install -r valutionapi/requirements.txt; fi
    
    # 🔥 ENHANCEMENT 3: Add formatting check with Black
    - name: Auto format code with Black
      run: |
        black valutionapi
      
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 valutionapi --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 valutionapi --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    # 🚀 ENHANCEMENT 5: Add build verification (import test)
    - name: Verify application can import (fail fast)
      working-directory: valutionapi
      env:
        PYTHONPATH: .
      run: |
        python -c "from app.main import app; print('✅ FastAPI app imported successfully')"
    
    # 🧪 ENHANCEMENT 4: Run tests with coverage
    - name: Test with pytest and coverage
      working-directory: valutionapi
      env:
        PYTHONPATH: .
      run: |
        coverage run -m pytest --junitxml=report.xml -v
        coverage report -m
        coverage xml
    
    # ✅ ENHANCEMENT 1: Upload test results for GitHub UI
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: valutionapi/report.xml
    
    # 📊 Upload coverage report
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: valutionapi/coverage.xml
